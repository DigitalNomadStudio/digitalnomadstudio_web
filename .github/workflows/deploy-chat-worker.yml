# Deploys the chat assistant Worker (chat-worker/) to Cloudflare.
#
# Runs on demand from the Actions tab, and automatically whenever chat-worker/ changes on main.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token created from the "Edit Cloudflare Workers" template
#   ANTHROPIC_API_KEY      - the dedicated Anthropic key for the website chat
# The Cloudflare account ID is not secret and lives in chat-worker/wrangler.toml.
name: Deploy chat Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chat-worker/**"

concurrency:
  group: deploy-chat-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the repository secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then missing="$missing ANTHROPIC_API_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "Both secrets are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json

      - name: Install dependencies
        working-directory: chat-worker
        run: npm ci

      - name: Run the Worker unit tests
        working-directory: chat-worker
        run: npm test

      - name: Deploy the Worker and set the ANTHROPIC_API_KEY secret
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: chat-worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Show the Worker URL
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker URL: $URL"
          {
            echo "### Chat Worker deployed"
            echo ""
            echo "URL: $URL"
            echo ""
            echo "Set this as the endpoint in chat-config.js to switch the website chat to AI mode."
          } >> "$GITHUB_STEP_SUMMARY"
