# Deploys the chat assistant Worker (chat-worker/) to Cloudflare.
#
# Runs on demand from the Actions tab, and automatically whenever chat-worker/ changes on main.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token created from the "Edit Cloudflare Workers" template
#   ANTHROPIC_API_KEY      - the dedicated Anthropic key for the website chat
# Optional third secret:
#   TURNSTILE_SECRET_KEY   - Cloudflare Turnstile secret; enables the bot check on the Worker
# The Cloudflare account ID is not secret and lives in chat-worker/wrangler.toml.
name: Deploy chat Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chat-worker/**"

concurrency:
  group: deploy-chat-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TURNSTILE: ${{ secrets.TURNSTILE_SECRET_KEY != '' }}
    steps:
      - name: Check the repository secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then missing="$missing ANTHROPIC_API_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "Both secrets are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json

      - name: Install dependencies
        working-directory: chat-worker
        run: npm ci

      - name: Run the Worker unit tests
        working-directory: chat-worker
        run: npm test

      - name: Deploy the Worker and set the ANTHROPIC_API_KEY secret
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: chat-worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Set the TURNSTILE_SECRET_KEY secret (only when configured)
        if: env.HAS_TURNSTILE == 'true'
        working-directory: chat-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY

      - name: Show the Worker URL
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker URL: $URL"
          {
            echo "### Chat Worker deployed"
            echo ""
            echo "URL: $URL"
            echo ""
            echo "Set this as the endpoint in chat-config.js to switch the website chat to AI mode."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the deployed Worker
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          # An on-topic enquiry (must reach the main model) and an off-topic one (must get the canned line).
          body='{"messages":[{"role":"user","content":"Hi, I run a small plumbing business in Sydney and typing up quotes takes me every evening. Can you help?"}],"page":"/deploy-check"}'
          trivia='{"messages":[{"role":"user","content":"whats the capital of france"}],"page":"/deploy-check"}'
          canned='I can only help with enquiries about software and AI projects for your business.'
          join_deltas() { python3 -c 'import sys, json; print("".join(json.loads(l[5:])["delta"] for l in sys.stdin if l.startswith("data:") and "\"delta\"" in l))'; }
          echo "Preflight from the website origin:"
          curl -sS -o /dev/null -w "  HTTP %{http_code}\n" -X OPTIONS "$URL" -H "Origin: https://www.digitalnomadstudio.io" --max-time 30
          echo "Request from an unknown origin (expect 403):"
          curl -sS -o /dev/null -w "  HTTP %{http_code}\n" "$URL" -H "Origin: https://example.org" -H "Content-Type: application/json" -d "$body" --max-time 30
          if [ "$HAS_TURNSTILE" = "true" ]; then
            echo "Turnstile is enabled: a request without a bot-check token must be refused (expect 403):"
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" -H "Origin: https://www.digitalnomadstudio.io" -H "Content-Type: application/json" -d "$body" --max-time 30)
            echo "  HTTP $code"
            if [ "$code" != "403" ]; then
              echo "::error::Expected 403 without a Turnstile token, got $code."
              exit 1
            fi
            echo "Skipping the live chat probe: it cannot pass the bot check from CI. Test the chat in a browser."
            exit 0
          fi
          echo "On-topic enquiry from the website origin:"
          response=$(curl -sS -N --max-time 120 "$URL" -H "Origin: https://www.digitalnomadstudio.io" -H "Content-Type: application/json" -d "$body")
          joined=$(printf '%s\n' "$response" | join_deltas)
          echo "  Reply: $joined"
          if ! printf '%s' "$response" | grep -q '"type":"text"'; then
            echo "::error::The Worker did not return a text reply. Check the ANTHROPIC_API_KEY secret and the response above."
            printf '%s\n' "$response" | head -c 3000; echo
            exit 1
          fi
          if printf '%s' "$joined" | grep -qF "$canned"; then
            echo "::error::A genuine enquiry was treated as off-topic. Review GATE_PROMPT in chat-worker/src/index.js."
            exit 1
          fi
          echo "The main model answered a genuine enquiry."
          echo "Off-topic probe (expect the canned refusal, no answer):"
          reply=$(curl -sS -N --max-time 120 "$URL" -H "Origin: https://www.digitalnomadstudio.io" -H "Content-Type: application/json" -d "$trivia")
          joined=$(printf '%s\n' "$reply" | join_deltas)
          echo "  Reply: $joined"
          if printf '%s' "$joined" | grep -qi 'paris'; then
            echo "::warning::The assistant answered an off-topic trivia question. Review GATE_PROMPT and the Scope rules in chat-worker/src/index.js."
          elif printf '%s' "$joined" | grep -qF "$canned"; then
            echo "Off-topic question got the canned refusal."
          else
            echo "::warning::Off-topic probe got an unexpected reply (not the canned line). Review the gate."
          fi
